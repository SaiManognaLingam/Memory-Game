<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Memory Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <h1 class="title">Neon Memory Game</h1>

    <div class="game-stats">
        <div class="stat-item">Pairs Matched: <span id="pairs-count">0</span> / 8</div>
        <div class="stat-item">Guesses: <span id="guesses-count">0</span></div>
        <div class="stat-item">Time: <span id="timer-count">0</span>s</div>
    </div>

    <section class="game-board"></section>

    <script src="script.js"></script>

</body>
</html>
